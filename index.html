<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bases</title>
    <link rel="stylesheet" href="./src/main/css/fonts.css">
    <link rel="stylesheet" href="./src/main/css/values.css">
    <link rel="stylesheet" href="./src/main/css/main.css">
    <link rel="stylesheet" href="./src/main/css/foundation.css">
    <link rel="stylesheet" href="./src/main/css/texts.css">
    <link rel="stylesheet" href="./src/main/css/styles.css">
    <link rel="icon">
    <meta name="version" content="0.0.1">
</head>
<body>
<div class="FlexBox" style="width: 100%; height: 100%; flex-direction: column;">
    <div class="FlexBox" style="width: 100%; padding: 16px; align-items: center;">
        <div id="ModuleTitle" class="Box ModuleTitle" style="flex: 1;">Bases</div>
        <div id="ColorsSwitch" class="Box Clickable ColorsSwitch"></div>
    </div>
    <div style="width: 100%; box-sizing: border-box; padding: 0 16px">
        <div style="width: 100%; height: 1px; background-color: var(--colors-selected);"></div>
    </div>
    <div id="BaseEncodings" class="FlexBox BaseEncodings" style="width: 100%;"></div>

        <div style="width: 100%; height: 1px; background-color: var(--colors-selected);"></div>
    </div>
    <div class="FlexBox" style="width: 100%; flex-direction: column; padding: 16px; gap: 16px">
        <textarea id="TextInput" placeholder="Enter your text for encoding..." class="TextInput" style="width: 100%; height: 128px;"></textarea>
        <code id="BaseEncoded" class="block BaseEncoded"></code>
        <div id="CopyButton" class="Box Clickable CopyButton">copy</div>
    </div>
</div>
